<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Mission · 루시와 영단어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3fb; --bg2:#e9ebfa; --card:#ffffff; --ink:#23215b; --text:#2a2840; --muted:#73718f; --line:#dfe1f2;
  --violet:#5b55e8; --violet-d:#3f3abf; --violet-soft:#e8e7ff;
  --coral:#ff6f86; --coral-soft:#ffe6ea;
  --mint:#21b89a; --mint-soft:#dbf6ef;
  --sun:#f5b224; --sun-soft:#fff2d3;
  --oops:#ef8a8a; --oops-soft:#fde9e9;
  --kr:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --en:'Space Grotesk','Noto Sans KR','Segoe UI',sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15142a; --bg2:#1b1a35; --card:#212041; --ink:#e9e8ff; --text:#ecebfa; --muted:#a6a4c6; --line:#34325c;
    --violet:#7c77ff; --violet-d:#5b55e8; --violet-soft:#2e2c5c;
    --coral-soft:#4a2635; --mint-soft:#183f3a; --sun-soft:#433618; --oops-soft:#47262b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15142a; --bg2:#1b1a35; --card:#212041; --ink:#e9e8ff; --text:#ecebfa; --muted:#a6a4c6; --line:#34325c;
  --violet:#7c77ff; --violet-d:#5b55e8; --violet-soft:#2e2c5c;
  --coral-soft:#4a2635; --mint-soft:#183f3a; --sun-soft:#433618; --oops-soft:#47262b;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{font-family:var(--kr);color:var(--text);font-size:16px;line-height:1.6;background:var(--bg);-webkit-tap-highlight-color:transparent}
#app{max-width:660px;margin:0 auto;padding:14px 16px 48px;position:relative;z-index:1}
h1,h2,h3{margin:0 0 10px;line-height:1.3;color:var(--ink)}
h2{font-size:1.45rem;font-weight:900;letter-spacing:-.02em}
h3{font-size:1.1rem;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.center{text-align:center}
.en-font{font-family:var(--en)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--violet);outline-offset:2px}

/* 배경 */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .6s}
#scene.on{opacity:1}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;animation:wander 26s ease-in-out infinite alternate}
.mark{position:absolute;right:-20px;bottom:30px;font-size:180px;opacity:.07;transform:rotate(-12deg)}
@keyframes wander{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,-50px) scale(1.15)}}

/* 버튼 */
.btn{font-weight:700;font-size:1.05rem;border:none;border-radius:14px;padding:13px 22px;color:#fff;background:var(--violet);box-shadow:0 4px 0 var(--violet-d);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--violet-d)}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 #d9536a}
.btn.coral:active{box-shadow:0 1px 0 #d9536a}
.btn.ghost{background:var(--card);color:var(--text);box-shadow:none;border:1.5px solid var(--line)}
.btn.sm{font-size:.92rem;padding:8px 14px;border-radius:11px}
.btn.xl{font-size:1.2rem;padding:17px 24px;width:100%}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}

/* 위쪽 막대 */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:6px 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.icon-btn{border:1.5px solid var(--line);background:var(--card);border-radius:12px;width:44px;height:44px;font-size:1.15rem;flex:none}
.pill{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700;font-size:.92rem;white-space:nowrap}
.pill .en-font{font-weight:700}
.spacer{flex:1}

/* 루시 */
.lucy{display:flex;align-items:flex-start;gap:10px;margin:4px 0 16px}
.lucy-ava{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;background:linear-gradient(140deg,var(--violet),var(--coral))}
.lucy-ava.swap{animation:pop .35s ease}
.lucy-body{flex:1;min-width:0}
.lucy-name{font-size:.8rem;font-weight:700;color:var(--muted);margin:0 0 3px 4px}
.bubble{background:var(--card);border:1.5px solid var(--line);border-radius:4px 16px 16px 16px;padding:11px 15px;font-size:1rem}
.bubble.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}

/* 카드 */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.progress{height:10px;border-radius:999px;background:var(--violet-soft);overflow:hidden;margin:10px 0 6px}
.progress>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--coral));transition:width .4s}

/* 처음 화면: 여권 */
.brand{margin:14px 0 4px}
.brand .word{font-family:var(--en);font-weight:700;font-size:3rem;letter-spacing:-.04em;line-height:.95;color:var(--ink)}
.brand .word span{display:block;color:var(--violet)}
.brand .sub{color:var(--muted);margin-top:8px}
.passport{background:linear-gradient(150deg,var(--ink),#3a3690);color:#fff;border-radius:22px;padding:20px;margin:16px 0;position:relative;overflow:hidden}
:root[data-theme="dark"] .passport{background:linear-gradient(150deg,#2b2970,#4a3fb0)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .passport{background:linear-gradient(150deg,#2b2970,#4a3fb0)}}
.passport::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:2px dashed rgba(255,255,255,.18)}
.pp-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pp-label{font-size:.8rem;opacity:.7}
.pp-level{font-family:var(--en);font-size:1.7rem;font-weight:700;line-height:1.1}
.pp-xp{font-family:var(--en);font-size:1.1rem;font-weight:700;color:var(--sun)}
.passport .progress{background:rgba(255,255,255,.15)}
.passport .progress>div{background:linear-gradient(90deg,var(--sun),var(--coral))}
.pp-foot{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;opacity:.9;margin-top:4px}
.home-btns{display:grid;gap:12px}

/* 탭과 입력 */
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--bg2);padding:5px;border-radius:14px}
.tab{flex:1;font-weight:700;padding:10px;border-radius:10px;border:none;background:transparent;color:var(--muted)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(40,30,120,.12)}
label{display:block;font-weight:700;font-size:.95rem;margin:12px 0 6px;color:var(--ink)}
.input,textarea{width:100%;font:inherit;font-size:1.05rem;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text)}
.input.en-in{font-family:var(--en);font-size:1.25rem;font-weight:500}
.with-btn{display:flex;gap:8px}
.with-btn .input{flex:1}
textarea{min-height:130px;resize:vertical;font-size:.98rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.opt-note{font-weight:400;color:var(--muted);font-size:.85rem}
.pk-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pk-tab{flex:none;font-weight:500;font-size:.9rem;padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--card)}
.pk-tab.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:8px 0 6px}
.emo{font-size:1.45rem;height:44px;border-radius:11px;border:1.5px solid var(--line);background:var(--card)}
.emo.on{border-color:var(--violet);background:var(--violet-soft)}
.photo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.photo-btn{display:inline-flex;margin:0;cursor:pointer;color:var(--text)}
.photo-prev{width:76px;height:76px;object-fit:cover;border-radius:14px;border:1.5px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* 단어 목록 */
.wlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.wlist li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line);flex-wrap:wrap}
.wlist .em{font-size:1.5rem;flex:none;width:40px;text-align:center}
.thumb{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none}
.thumb-letter{width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;font-family:var(--en);font-weight:700;color:#fff;background:linear-gradient(140deg,var(--violet),var(--coral))}
.wlist .en{font-family:var(--en);font-weight:700;font-size:1.12rem}
.wlist .ko{color:var(--muted)}
.wlist .grow{flex:1;min-width:120px}
.li-btns{display:flex;gap:6px;margin-left:auto}
.badge{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.badge.admin{background:var(--violet-soft);color:var(--violet)}
.badge.child{background:var(--coral-soft);color:var(--coral)}
.badge.bonus{background:var(--sun-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--violet-soft);border-radius:10px;padding:4px 10px;font-family:var(--en);font-weight:500}
.speak{border:none;background:var(--violet-soft);border-radius:12px;width:40px;height:40px;font-size:1.05rem;flex:none}

/* 그림 */
.pic-emo{display:inline-block;line-height:1.1}
.pic-img{display:block;margin:0 auto;object-fit:cover;border-radius:18px;border:1.5px solid var(--line)}
.pic-letter{display:grid;place-items:center;margin:0 auto;border-radius:20px;font-family:var(--en);font-weight:700;color:#fff;background:linear-gradient(140deg,var(--violet),var(--coral))}

/* 단어 카드: 탑승권 */
.ticket{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px}
.ticket-top{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:var(--ink);color:#fff;font-size:.85rem}
:root[data-theme="dark"] .ticket-top{background:#2f2c78}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ticket-top{background:#2f2c78}}
.ticket-top .en-font{font-weight:700;letter-spacing:.04em}
.ticket-main{text-align:center;padding:24px 18px 18px}
.ticket-main .pic-emo{font-size:4.6rem}
.ticket-main .pic-img{width:140px;height:140px}
.ticket-main .pic-letter{width:110px;height:110px;font-size:3.4rem}
.ticket .w-en{font-family:var(--en);font-weight:700;font-size:2.7rem;letter-spacing:-.03em;color:var(--ink);margin:10px 0 0;word-break:break-word;line-height:1.1}
.ticket .w-ko{font-size:1.35rem;font-weight:700;margin:8px 0 2px}
.perf{position:relative;border-top:2px dashed var(--line);margin:0 18px}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line)}
.perf::before{left:-30px}.perf::after{right:-30px}
.ticket-ex{padding:14px 18px 18px;font-size:1.05rem}
.ticket-ex b{color:var(--coral)}
.ticket-ex .en-line{font-family:var(--en);font-weight:500}
.dots{display:flex;justify-content:center;gap:6px;margin:2px 0 12px}
.dots span{width:26px;height:5px;border-radius:999px;background:var(--line)}
.dots span.on{background:var(--violet)}

/* 게임 공통 */
.game-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.92rem}
.tag{font-weight:700;background:var(--violet-soft);color:var(--violet);padding:3px 11px;border-radius:999px}
.q-card{text-align:center;padding:22px 18px}
.q-card .pic-emo{font-size:4.4rem}
.q-card .pic-img{width:120px;height:120px}
.q-card .pic-letter{width:90px;height:90px;font-size:2.8rem}
.q-word{font-family:var(--en);font-weight:700;font-size:2.5rem;letter-spacing:-.03em;color:var(--ink);display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;word-break:break-word}
.q-word.ko{font-family:var(--kr);font-size:1.9rem}
.q-sub{color:var(--muted);margin-top:6px}
.q-sentence{font-family:var(--en);font-weight:500;font-size:1.5rem;line-height:1.5}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--coral);color:var(--coral)}
.big-speak{font-size:2.8rem;width:110px;height:110px;border-radius:28px;border:none;background:var(--violet-soft);box-shadow:0 5px 0 var(--violet)}
.big-speak:active{transform:translateY(4px);box-shadow:0 1px 0 var(--violet)}
.opts{display:grid;gap:10px}
.opt{font-weight:700;font-size:1.2rem;padding:15px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:left;display:flex;align-items:center;gap:12px}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--en);font-size:.9rem;background:var(--bg2);color:var(--muted)}
.opt.en-opt{font-family:var(--en);font-size:1.35rem}
.opt.right{background:var(--mint-soft);border-color:var(--mint)}
.opt.right .k{background:var(--mint);color:#fff}
.opt.wrong{background:var(--oops-soft);border-color:var(--oops);opacity:.6;animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin:18px 0}
.slot{width:40px;height:50px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--en);font-weight:700;font-size:1.6rem;background:var(--bg)}
.slot.fill{border-style:solid;border-color:var(--violet)}
.slot.lock{border-color:var(--sun);background:var(--sun-soft)}
.slot.fixed{border:2px solid transparent;background:transparent;color:var(--muted)}
.slot.gap{width:14px;border:none;background:transparent}
.slot.hole{border-color:var(--coral)}
.slot.hole.fill{border-color:var(--violet);border-style:solid}
.slots.right .slot:not(.fixed):not(.gap){border-color:var(--mint);background:var(--mint-soft)}
.slots.reveal .slot:not(.fixed):not(.gap){border-color:var(--violet);background:var(--violet-soft)}
.slots.shake{animation:shake .35s}
.tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tile{width:50px;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);font-family:var(--en);font-weight:700;font-size:1.55rem}
.tile:active{transform:translateY(2px);box-shadow:none}
.tile:disabled{opacity:.25;box-shadow:none}
.next-wrap{margin-top:14px;display:none}
.next-wrap.show{display:block;animation:pop .3s}

/* 카드 매칭 */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.mcard{border:none;background:none;padding:0;aspect-ratio:3/4;perspective:700px}
.mc-inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.flipped .mc-inner,.mcard.done .mc-inner{transform:rotateY(180deg)}
.mc-front,.mc-back{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:6px;text-align:center}
.mc-front{background:var(--ink);color:#fff;font-size:1.8rem;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 8px,transparent 8px 16px)}
.mc-back{background:var(--card);border:1.5px solid var(--line);transform:rotateY(180deg)}
.mc-back .pic-emo{font-size:2rem}
.mc-back .pic-img{width:52px;height:52px;border-radius:10px}
.mc-en{font-family:var(--en);font-weight:700;font-size:1.1rem;color:var(--ink);word-break:break-word;line-height:1.15}
.mc-ko{font-size:.82rem;color:var(--muted);line-height:1.25;margin-top:3px;word-break:keep-all}
.mc-ko.solo{font-size:1rem;font-weight:700;color:var(--text)}
.mcard.done .mc-back{border-color:var(--mint);background:var(--mint-soft)}

/* 버블 팝 */
.sky-area{position:relative;height:360px;overflow:hidden;border-radius:18px;background:linear-gradient(180deg,var(--bg2),var(--violet-soft));border:1.5px solid var(--line)}
.bubble-b{
  position:absolute;bottom:-130px;left:var(--left);width:100px;height:100px;border-radius:50%;padding:8px;
  border:2px solid rgba(255,255,255,.7);
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.85) 0 9%,transparent 10%),radial-gradient(circle at 50% 50%,transparent 45%,rgba(255,255,255,.25) 100%),var(--bc);
  color:#fff;font-family:var(--en);font-weight:700;font-size:1.05rem;line-height:1.1;word-break:break-word;text-shadow:0 1px 2px rgba(0,0,0,.3);
  animation:rise-up var(--dur) linear infinite;animation-delay:var(--delay);
}
.bubble-b.wrong{opacity:.25;animation-play-state:paused}
.bubble-b.right{animation-play-state:paused;box-shadow:0 0 0 5px var(--mint),0 0 24px var(--mint)}
.bubble-b.popped{animation:burst .4s ease-out forwards}
@keyframes rise-up{0%{transform:translate(0,0)}25%{transform:translate(8px,-155px)}50%{transform:translate(0,-310px)}75%{transform:translate(-8px,-465px)}100%{transform:translate(0,-620px)}}
@keyframes burst{0%{transform:translateY(var(--y,-200px)) scale(1);opacity:1}100%{transform:translateY(var(--y,-200px)) scale(1.7);opacity:0}}
.boom{position:absolute;font-family:var(--en);font-weight:700;font-size:1.6rem;color:var(--coral);pointer-events:none;animation:floatup 1s ease-out forwards;transform:translateX(-50%)}

/* 결과: 스탬프 */
.result-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.stat .v{font-family:var(--en);font-weight:700;font-size:1.6rem;color:var(--ink)}
.stamp{width:150px;height:150px;margin:6px auto 14px;border-radius:50%;border:4px double var(--coral);color:var(--coral);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg);animation:stampIn .5s cubic-bezier(.2,1.6,.4,1)}
.stamp .ic{font-size:2.6rem;line-height:1}
.stamp .city{font-weight:900;font-size:1rem;margin-top:4px}
.stamp .date{font-family:var(--en);font-size:.8rem;font-weight:700}
@keyframes stampIn{0%{transform:rotate(-10deg) scale(2.2);opacity:0}100%{transform:rotate(-10deg) scale(1);opacity:1}}

/* 기록 */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.92rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1.5px solid var(--line);vertical-align:top}
th{font-weight:700}
td .badge{margin-right:4px}
.gstat{display:grid;grid-template-columns:8.5em 1fr 6.5em;gap:10px;align-items:center;margin-bottom:8px;font-size:.92rem}
.gstat .progress{margin:0}
.gstat .num{text-align:right;color:var(--muted);font-family:var(--en)}

/* 팝업 */
.overlay{position:fixed;inset:0;background:rgba(20,18,50,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal{background:var(--card);border-radius:20px;padding:22px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;border:1.5px solid var(--line);animation:pop .25s}
.modal h3{text-align:center}
.modal-body{margin:6px 0 16px;text-align:center}
.modal-body .input{text-align:left}
.modal-body label{text-align:left}
.modal-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.xp-pop{position:fixed;font-family:var(--en);font-weight:700;font-size:1.4rem;color:var(--violet);pointer-events:none;z-index:60;animation:floatup 1s ease-out forwards}
@keyframes floatup{0%{transform:translate(-50%,0);opacity:0}25%{opacity:1;transform:translate(-50%,-16px)}100%{transform:translate(-50%,-90px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:12px;z-index:70;font-size:.95rem;animation:pop .3s;max-width:90vw;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

/* 따라 말하기 */
.mic{width:86px;height:86px;border-radius:50%;border:none;font-size:2.2rem;color:#fff;background:linear-gradient(140deg,var(--coral),var(--violet));box-shadow:0 5px 0 var(--violet-d);margin:14px auto 4px;display:grid;place-items:center}
.mic:active{transform:translateY(3px);box-shadow:0 2px 0 var(--violet-d)}
.mic.on{animation:pulse 1.1s ease-out infinite}
.mic:disabled{opacity:.5}
.mic.sm{width:44px;height:44px;font-size:1.15rem;margin:0;box-shadow:0 3px 0 var(--violet-d);border-radius:12px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,111,134,.55),0 5px 0 var(--violet-d)}100%{box-shadow:0 0 0 22px rgba(255,111,134,0),0 5px 0 var(--violet-d)}}
.mic-label{font-size:.9rem;color:var(--muted);min-height:1.4em}
.sp-fb{margin:14px auto 0;max-width:380px;border-radius:16px;padding:14px;border:1.5px solid var(--line);background:var(--bg);text-align:center;animation:pop .3s}
.sp-fb.excellent{border-color:var(--mint);background:var(--mint-soft)}
.sp-fb.good{border-color:var(--sun);background:var(--sun-soft)}
.sp-fb.retry{border-color:var(--oops);background:var(--oops-soft)}
.sp-score{font-family:var(--en);font-weight:700;font-size:2.3rem;line-height:1;color:var(--ink)}
.sp-score small{font-size:1rem;font-weight:500;color:var(--muted)}
.sp-level{font-weight:900;margin:4px 0 6px}
.sp-heard{font-size:.9rem;color:var(--muted)}
.sp-heard b{font-family:var(--en);color:var(--text)}
.sp-fb .progress{margin:8px 0 2px;background:rgba(127,127,160,.18)}
.sp-err{margin:12px auto 0;max-width:380px;font-size:.92rem;padding:10px 12px;border-radius:12px;background:var(--bg2);color:var(--text)}
/* 스펠링 쓰기, 받아쓰기 */
.type-row{display:flex;gap:8px;max-width:420px;margin:16px auto 0}
.type-in{flex:1;text-align:center;font-size:1.5rem!important}
.type-in.ok{border-color:var(--mint);background:var(--mint-soft)}
.type-in.shake{animation:shake .35s;border-color:var(--oops)}
.type-hint{margin-top:10px;font-size:1.3rem;letter-spacing:.08em;min-height:1.6em}
/* O/X */
.ox-eq{font-family:var(--en);font-size:1.6rem;color:var(--muted);margin:2px 0}
.ox-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox{font-family:var(--en);font-weight:700;font-size:2.6rem;height:96px;border-radius:18px;border:1.5px solid var(--line);background:var(--card)}
.ox.o{color:var(--mint)}.ox.x{color:var(--coral)}
.ox.right{background:var(--mint-soft);border-color:var(--mint)}
.ox.wrong{background:var(--oops-soft);border-color:var(--oops);animation:shake .35s}
/* 짝 연결 */
.cn-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cn-col{display:grid;gap:9px;align-content:start}
.cn{min-height:56px;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;word-break:keep-all;line-height:1.25}
.cn.en{font-family:var(--en);font-size:1.15rem}
.cn.sel{border-color:var(--violet);background:var(--violet-soft);box-shadow:0 0 0 3px var(--violet-soft)}
.cn.done{cursor:default;color:var(--text)}
.cn.c0{border-color:#5b55e8;background:rgba(91,85,232,.12)}.cn.c1{border-color:#ff6f86;background:rgba(255,111,134,.12)}
.cn.c2{border-color:#21b89a;background:rgba(33,184,154,.12)}.cn.c3{border-color:#f5b224;background:rgba(245,178,36,.14)}
.cn.c4{border-color:#3aa0f0;background:rgba(58,160,240,.12)}
.cn.shake{animation:shake .35s}
/* 단어 금고 */
.lives{margin-top:10px;font-size:1.05rem;letter-spacing:2px}
.kb{display:grid;gap:6px;margin-top:4px}
.kb-row{display:flex;justify-content:center;gap:5px}
.key{width:34px;height:42px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-family:var(--en);font-weight:700;font-size:1.1rem;padding:0}
.key.hit{background:var(--mint-soft);border-color:var(--mint)}
.key.miss{background:var(--oops-soft);border-color:var(--oops);opacity:.5}
@media (max-width:420px){.key{width:29px;height:40px;font-size:1rem}.kb-row{gap:4px}}
.card-actions{display:flex;gap:10px;justify-content:center;align-items:center;margin:10px 0 2px}

@media (max-width:480px){
  .grid2{grid-template-columns:1fr}
  .brand .word{font-size:2.5rem}
  .ticket .w-en,.q-word{font-size:2.1rem}
  .slot{width:33px;height:44px;font-size:1.35rem}
  .tile{width:46px;height:46px}
  .mgrid{gap:6px}
  .mc-en{font-size:.95rem}
  .bubble-b{width:86px;height:86px;font-size:.92rem}
  .gstat{grid-template-columns:7em 1fr 5.5em}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .bubble-b{bottom:auto;top:var(--top)}
}
</style>
</head>
<body>
<div id="scene" aria-hidden="true"></div>
<main id="app"></main>
<canvas id="confetti"></canvas>

<script>
/* ===================== 설정값 ===================== */
const DAILY=5, MIN_WORDS=3, PASS=75;

const PICKER={
  '동물':['🐱','🐶','🐰','🐻','🐼','🦊','🦁','🐯','🐮','🐷','🐸','🐵','🐧','🐦','🦉','🦋','🐟','🐬','🐢','🦄'],
  '음식':['🍎','🍌','🍓','🍇','🍉','🍑','🥕','🍞','🧀','🍕','🍔','🍟','🍰','🍪','🍩','🍫','🍦','🥛','☕','🍜'],
  '자연·날씨':['🌸','🌻','🌳','🍀','🍁','🌈','☀️','🌙','⭐','☁️','🌧️','❄️','🌊','⛰️','🔥','💧','🌍','🌋'],
  '사물·장소':['📚','✏️','🎒','💻','📱','⏰','🏠','🏫','🏥','🚗','🚲','✈️','🚀','☂️','🔑','🎁','💡','🗺️','📷','🧭'],
  '사람·감정':['👩','👨','👧','👦','👶','👵','🧑‍🏫','🧑‍⚕️','😊','😢','😠','😴','😋','🤩','😨','🥰','😎','🤔','😮','🤗'],
  '활동':['⚽','🏀','🏸','🎨','🎤','🎹','🎸','🎮','🎬','📖','✍️','🏊','🏃','💃','🧘','🚴','🎧','🛒','🍳','🧹']
};

const LEVELS=[{n:0,t:'Beginner'},{n:10,t:'Rookie'},{n:30,t:'Explorer'},{n:60,t:'Challenger'},{n:100,t:'Expert'},{n:200,t:'Master'},{n:350,t:'Legend'}];

const GAME_INFO={
  type:{name:'스펠링 쓰기',how:'뜻을 보고 영어 단어를 직접 입력하세요.'},
  dict:{name:'받아쓰기',how:'🔊 발음을 듣고 들리는 단어를 영어로 입력하세요. 여러 번 들어도 돼요.'},
  ox:{name:'O/X 퀴즈',how:'영어 단어와 뜻이 맞으면 O, 틀리면 X를 누르세요.'},
  connect:{name:'짝 연결',how:'왼쪽 영어와 오른쪽 뜻을 하나씩 눌러 짝을 연결하세요.'},
  vault:{name:'단어 금고',how:'알파벳을 하나씩 골라 숨은 단어를 맞히세요. 기회는 6번이에요.'},
  speak:{name:'따라 말하기',how:'루시의 발음을 듣고 🎤를 눌러 따라 말해보세요. 75점 이상이면 통과예요.'},
  meaning:{name:'뜻 고르기',how:'영어 단어를 보고 맞는 뜻을 고르세요.'},
  scramble:{name:'철자 맞추기',how:'섞인 알파벳을 순서대로 눌러 단어를 완성하세요.'},
  blank:{name:'빈칸 채우기',how:'예문의 빈칸에 들어갈 단어를 고르세요.'},
  emoji:{name:'그림 퀴즈',how:'그림을 보고 맞는 영어 단어를 고르세요.'},
  listen:{name:'듣고 고르기',how:'🔊 발음을 듣고 맞는 단어를 고르세요. 여러 번 들어도 돼요.'},
  match:{name:'카드 매칭',how:'카드를 두 장씩 뒤집어 영어 단어와 뜻이 맞는 짝을 찾으세요.'},
  balloon:{name:'버블 팝',how:'위의 뜻에 맞는 영어 버블을 눌러 터뜨리세요. 시간 제한은 없어요.'},
  missing:{name:'빠진 글자',how:'단어에서 빠진 글자를 순서대로 골라 채우세요.'}
};

const MOODS={hi:'👋',praise:'💯',hint:'💡',cheer:'💪',party:'🎉'};
const PRAISE=['정답! 👍','완벽해요.','좋아요, 감 잡았네요.','역시! 💯','깔끔하게 성공 ✨','바로 맞혔네요. 👏'];
const CHEER=['다음 문제 갑니다.','이 페이스 좋아요.','집중! 계속 가볼게요.','좋아요, 다음!'];

const CITIES=[
  {key:'london',name:'런던',en:'LONDON',icon:'🎡',c1:'#5b55e8',c2:'#ff6f86',line:'오늘의 미션 도시는 런던이에요. 단어를 맞힐 때마다 마일리지가 쌓여요.'},
  {key:'newyork',name:'뉴욕',en:'NEW YORK',icon:'🗽',c1:'#21b89a',c2:'#5b55e8',line:'오늘의 미션 도시는 뉴욕이에요. 다섯 단어 끝내고 스탬프 받아가요.'},
  {key:'paris',name:'파리',en:'PARIS',icon:'🗼',c1:'#ff6f86',c2:'#f5b224',line:'오늘의 미션 도시는 파리예요. 오늘 단어도 깔끔하게 끝내볼까요?'},
  {key:'tokyo',name:'도쿄',en:'TOKYO',icon:'🗻',c1:'#f5b224',c2:'#ff6f86',line:'오늘의 미션 도시는 도쿄예요. 집중해서 스탬프 하나 더 모아요.'},
  {key:'sydney',name:'시드니',en:'SYDNEY',icon:'🦘',c1:'#3aa0f0',c2:'#21b89a',line:'오늘의 미션 도시는 시드니예요. 단어 다섯 개, 시작해볼게요.'}
];
function cityFor(date){const n=Math.floor(Date.parse(date+'T00:00:00')/86400000);return CITIES[((n%CITIES.length)+CITIES.length)%CITIES.length];}
function curCity(){return (S.today&&CITIES.find(c=>c.key===S.today.city))||cityFor(todayStr());}

/* ===================== 저장 ===================== */
const KEY='lucy_word_adventure_v1';
const memStore={};
let warnedQuota=false;
function defaultState(){return {childName:'',pin:'0000',stars:0,adminQueue:[],childQueue:[],wordBook:{},wrong:{},history:[],today:null,streak:0,lastStudy:null,bonus:{date:'',count:0},gameStats:{},speakHard:{},speakBest:{},lastGames:[]};}
function normWord(w){
  if(!w)return w;
  if(!Array.isArray(w.emojis))w.emojis=w.emoji?[w.emoji]:[];
  delete w.emoji;
  w.emojis=w.emojis.filter(e=>e&&e!=='✨');
  w.img=w.img||'';w.ex=w.ex||'';w.exKo=w.exKo||'';
  return w;
}
function loadState(){
  let s=null;
  try{const raw=localStorage.getItem(KEY);if(raw)s=JSON.parse(raw);}catch(e){}
  if(!s&&memStore[KEY])s=memStore[KEY];
  const st=Object.assign(defaultState(),s||{});
  st.adminQueue.forEach(normWord);st.childQueue.forEach(normWord);
  if(st.today)st.today.words.forEach(normWord);
  Object.values(st.wordBook).forEach(normWord);
  st.gameStats=st.gameStats||{};st.speakHard=st.speakHard||{};st.speakBest=st.speakBest||{};st.lastGames=st.lastGames||[];
  return st;
}
let S=loadState();
function save(){
  memStore[KEY]=S;
  try{localStorage.setItem(KEY,JSON.stringify(S));warnedQuota=false;}
  catch(e){
    const quota=e&&(e.name==='QuotaExceededError'||e.code===22||e.name==='NS_ERROR_DOM_QUOTA_REACHED');
    if(quota&&!warnedQuota){warnedQuota=true;setTimeout(()=>alertBox('저장 공간이 부족해요. 사진이 너무 많아요.<br><span class="muted small">사진이 있는 단어를 몇 개 지우면 다시 저장돼요. 지금 게임은 계속할 수 있어요.</span>'),60);}
  }
}

/* ===================== 도우미 ===================== */
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const uniq=a=>[...new Set(a)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const todayStr=()=>dstr(new Date());
const yesterdayStr=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d);};
const todayObj=()=>S.today&&S.today.date===todayStr()?S.today:null;
const nmHi=()=>S.childName?`${esc(S.childName)}님`:'';
function levelOf(x){let i=0;LEVELS.forEach((l,k)=>{if(x>=l.n)i=k;});return {idx:i+1,...LEVELS[i]};}
const levelName=x=>{const l=levelOf(x);return `LV.${l.idx} ${l.t}`;};
function nextLevel(x){return LEVELS.find(l=>l.n>x)||null;}
function curStreak(){return (S.lastStudy===todayStr()||S.lastStudy===yesterdayStr())?S.streak:0;}
const reRx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const wordRx=en=>new RegExp('\\b'+reRx(en)+'\\b','i');
const hasEx=w=>!!(w.ex&&wordRx(w.en).test(w.ex));
const hasPic=w=>!!(w.img||w.emojis.length);
const parseEmojis=s=>String(s||'').split(/[\s,]+/).map(x=>x.trim()).filter(Boolean);
const pouchCount=()=>S.adminQueue.length+S.childQueue.length;
function srcLabel(src,adult){
  if(adult)return {admin:'운영자',child:'아이',bonus:'보너스'}[src]||'';
  return {admin:'📌 지정 단어',child:'✍️ 내가 넣은 단어',bonus:'보너스'}[src]||'';
}
const badge=(src,adult)=>`<span class="badge ${src}">${srcLabel(src,adult)}</span>`;

/* 그림: 사진 > 이모지(무작위) > 첫 글자 타일 */
function pic(w){
  if(w.img)return `<img class="pic-img" src="${esc(w.img)}" alt="${esc(w.en)} 그림">`;
  if(w.emojis.length)return `<span class="pic-emo">${pick(w.emojis)}</span>`;
  return `<span class="pic-letter">${esc(w.en[0].toUpperCase())}</span>`;
}
function thumb(w){
  if(w.img)return `<img class="thumb" src="${esc(w.img)}" alt="">`;
  if(w.emojis.length)return `<span class="em">${w.emojis[0]}</span>`;
  return `<span class="thumb-letter">${esc(w.en[0].toUpperCase())}</span>`;
}
const chipPic=w=>w.img?'📷':(w.emojis[0]||'');

function render(html){app.innerHTML=html;window.scrollTo(0,0);}
function lucy(text,mood='hi'){return `<div class="lucy"><div class="lucy-ava" id="lucyAva" aria-hidden="true">${MOODS[mood]}</div><div class="lucy-body"><div class="lucy-name">루시 · 학습 코치</div><div class="bubble" id="lucyBubble">${text}</div></div></div>`;}
function setLucy(text,mood='hi'){
  const b=document.getElementById('lucyBubble'),a=document.getElementById('lucyAva');if(!b)return;
  b.innerHTML=text;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
  if(a&&a.textContent!==MOODS[mood]){a.textContent=MOODS[mood];a.classList.remove('swap');void a.offsetWidth;a.classList.add('swap');}
}
function topBar(){
  return `<div class="topbar"><button class="icon-btn" onclick="goHome()" aria-label="처음 화면">🏠</button><div class="spacer"></div><div class="pill">XP <span class="en-font" id="xpCount">${S.stars}</span></div><div class="pill en-font" id="levelPill">${levelName(S.stars)}</div></div>`;
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

/* 배경 */
let sceneKey=null;
function setScene(on){
  const el=document.getElementById('scene');
  if(!on){el.classList.remove('on');sceneKey=null;return;}
  const c=curCity();
  if(sceneKey!==c.key){
    sceneKey=c.key;
    el.innerHTML=`<div class="blob" style="width:340px;height:340px;left:-80px;top:-60px;background:${c.c1}"></div>
      <div class="blob" style="width:300px;height:300px;right:-90px;top:40%;background:${c.c2};animation-delay:-9s"></div>
      <div class="mark">${c.icon}</div>`;
  }
  el.classList.add('on');
}

/* 팝업 */
function modal({title='',body='',buttons=[{label:'확인',value:true}]}){
  return new Promise(res=>{
    const ov=document.createElement('div');ov.className='overlay';
    ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${title?`<h3>${title}</h3>`:''}<div class="modal-body">${body}</div><div class="modal-btns">${buttons.map((b,i)=>`<button class="btn sm ${b.cls||''}" data-i="${i}">${b.label}</button>`).join('')}</div></div>`;
    document.body.appendChild(ov);
    ov.querySelectorAll('.modal-btns button').forEach(btn=>btn.onclick=()=>{
      const data={};ov.querySelectorAll('[data-field]').forEach(el=>data[el.dataset.field]=el.value);
      ov.remove();res({value:buttons[+btn.dataset.i].value,data});
    });
    const f=ov.querySelector('input:not([type=hidden]):not([type=file])')||ov.querySelector('.modal-btns button:last-child');if(f)f.focus();
  });
}
const alertBox=msg=>modal({body:msg});
async function confirmBox(msg,yes='네',no='아니요'){return (await modal({body:msg,buttons:[{label:no,value:false,cls:'ghost'},{label:yes,value:true}]})).value;}

/* 음성 */
const canSpeak='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
let enVoice=null;
function loadVoices(){
  if(!canSpeak)return;
  const vs=speechSynthesis.getVoices();
  enVoice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/samantha|google us|female|zira|aria|jenny/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
}
if(canSpeak){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
function speak(t){
  if(!t)return;
  if(!canSpeak){toast('이 기기에서는 소리 기능을 쓸 수 없어요');return;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.88;if(enVoice)u.voice=enVoice;speechSynthesis.speak(u);}catch(e){}
}
const speakBtn=en=>`<button class="speak" data-say="${esc(en)}" onclick="speak(this.dataset.say)" aria-label="발음 듣기">🔊</button>`;
function speakField(id){const el=document.getElementById(id);const v=el&&el.value.trim();if(!v){toast('먼저 영어 단어를 적어주세요');return;}speak(v);}

/* 음성 인식: 따라 말하기 평가 */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const canListen=!!SR;
let listening=false;
function listenOnce(){
  return new Promise(resolve=>{
    if(!SR)return resolve({error:'unsupported'});
    try{if(canSpeak)speechSynthesis.cancel();}catch(e){}
    let r;try{r=new SR();}catch(e){return resolve({error:'unsupported'});}
    r.lang='en-US';r.interimResults=false;r.maxAlternatives=5;r.continuous=false;
    let done=false,timer=null;
    const end=v=>{if(done)return;done=true;clearTimeout(timer);listening=false;resolve(v);};
    r.onresult=e=>{const res=e.results[0],alts=[];for(let i=0;i<res.length;i++)alts.push({t:res[i].transcript,c:res[i].confidence});end({alts});};
    r.onerror=e=>end({error:e.error||'error'});
    r.onend=()=>end({error:'no-speech'});
    timer=setTimeout(()=>{try{r.stop();}catch(e){}},7000);
    try{r.start();listening=true;}catch(e){end({error:'busy'});}
  });
}
function lev(a,b){
  const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
const simil=(a,b)=>(!a||!b)?0:1-lev(a,b)/Math.max(a.length,b.length);
function soundex(w){
  w=w.replace(/[^a-z]/g,'');if(!w)return '';
  const map={b:1,f:1,p:1,v:1,c:2,g:2,j:2,k:2,q:2,s:2,x:2,z:2,d:3,t:3,l:4,m:5,n:5,r:6};
  let out=w[0].toUpperCase(),prev=map[w[0]]||0;
  for(let i=1;i<w.length&&out.length<4;i++){const c=w[i],code=map[c]||0;if(code&&code!==prev)out+=code;if(c!=='h'&&c!=='w')prev=code;}
  return out.padEnd(4,'0');
}
const soundexPhrase=s=>s.split(' ').map(soundex).join(' ');
const normSpeech=s=>String(s||'').toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
/* 인식된 후보들 중 목표 단어와 가장 가까운 것으로 점수를 매겨요 */
function evaluateSpeech(target,alts){
  const t=normSpeech(target),n=t.split(' ').length,tsx=soundexPhrase(t);
  let best={score:0,heard:(alts[0]&&alts[0].t)||''};
  for(const a of alts){
    const h=normSpeech(a.t);if(!h)continue;
    let sc;
    if(h===t||(' '+h+' ').includes(' '+t+' '))sc=100;
    else{
      const ws=h.split(' ');let sim=Math.max(simil(h,t),simil(h.replace(/ /g,''),t.replace(/ /g,''))),sx=soundexPhrase(h)===tsx;
      for(let i=0;i+n<=ws.length;i++){const win=ws.slice(i,i+n).join(' ');sim=Math.max(sim,simil(win,t));if(soundexPhrase(win)===tsx)sx=true;}
      sc=Math.round(sim*100);
      if(sx&&sc<82)sc=82;
      sc=Math.min(sc,95);
    }
    if(sc>best.score)best={score:sc,heard:a.t};
  }
  best.level=best.score>=90?'excellent':best.score>=PASS?'good':'retry';
  return best;
}
function speechFbHtml(ev){
  const lv={excellent:'완벽해요! 🎧',good:'좋아요, 잘 들렸어요 👍',retry:'한 번 더 해볼까요?'}[ev.level];
  return `<div class="sp-fb ${ev.level}" role="status"><div class="sp-score">${ev.score}<small>점</small></div><div class="sp-level">${lv}</div><div class="progress"><div style="width:${ev.score}%"></div></div><div class="sp-heard">루시가 들은 말: <b>${esc(ev.heard||'(알아듣지 못했어요)')}</b></div></div>`;
}
function speechErrText(code){
  return ({
    'not-allowed':'마이크 사용이 허용되지 않았어요. 주소창 옆 아이콘을 눌러 마이크를 허용해 주세요.',
    'service-not-allowed':'마이크 사용이 허용되지 않았어요. 주소창 옆 아이콘을 눌러 마이크를 허용해 주세요.',
    'no-speech':'소리가 들리지 않았어요. 🎤를 누른 뒤 바로 또렷하게 말해 주세요.',
    'audio-capture':'마이크를 찾을 수 없어요. 마이크가 연결돼 있는지 확인해 주세요.',
    'network':'음성 인식은 인터넷 연결이 필요해요. 연결을 확인해 주세요.',
    'unsupported':'이 브라우저는 음성 인식을 지원하지 않아요. 크롬, 엣지, 사파리에서 열어 주세요.',
    'aborted':'잠시 후 다시 눌러 주세요.','busy':'잠시 후 다시 눌러 주세요.'
  })[code]||'음성을 알아듣지 못했어요. 다시 눌러 주세요.';
}
function setMic(id,on){
  const b=document.getElementById(id);if(b){b.classList.toggle('on',on);b.disabled=false;}
  const l=document.getElementById(id+'Label');if(l)l.textContent=on?'듣고 있어요… 지금 말하세요':'눌러서 따라 말하기';
}
function saveSpeakScore(en,score){if(!S.speakBest[en]||score>S.speakBest[en])S.speakBest[en]=score;save();}

/* 단어 카드에서 연습 (XP 없음) */
async function cardSpeak(i){
  if(listening)return;
  const w=S.today.words[i],fb=document.getElementById('cardFb');
  setMic('cardMic',true);const r=await listenOnce();setMic('cardMic',false);
  if(r.error){fb.innerHTML=`<div class="sp-err">${speechErrText(r.error)}</div>`;return;}
  const ev=evaluateSpeech(w.en,r.alts);saveSpeakScore(w.en,ev.score);
  fb.innerHTML=speechFbHtml(ev);
  setLucy(ev.level==='retry'?`‘${esc(ev.heard)}’로 들렸어요. 🔊로 다시 듣고 따라 해보세요.`:ev.level==='excellent'?'발음 완벽해요! 다음 카드로 가볼까요?':'좋아요! 한 번 더 하면 더 정확해질 거예요.',ev.level==='retry'?'hint':'praise');
  if(ev.level==='retry')setTimeout(()=>speak(w.en),700);
}

/* XP, 마일리지, 색종이 */
function floatAt(el,text){
  const r=el?el.getBoundingClientRect():{left:innerWidth/2,width:0,top:innerHeight/2};
  const s=document.createElement('div');s.className='xp-pop';s.textContent=text;
  s.style.left=(r.left+r.width/2)+'px';s.style.top=r.top+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
}
function giveXP(el){
  const before=levelOf(S.stars).idx;S.stars++;save();floatAt(el,'+1 XP');
  const c=document.getElementById('xpCount');if(c)c.textContent=S.stars;
  const lp=document.getElementById('levelPill');if(lp)lp.textContent=levelName(S.stars);
  if(levelOf(S.stars).idx>before)setTimeout(()=>{confetti();modal({title:'레벨 업! 🎉',body:`<div class="en-font" style="font-size:1.9rem;font-weight:700;color:var(--violet)">${levelName(S.stars)}</div><p class="muted">XP ${S.stars} 달성. 계속 이 페이스로 가요!</p>`});},700);
}
function giveMile(){
  if(!session||session.phase!=='game')return;
  session.miles++;
  const c=document.getElementById('mileCount');if(c)c.textContent=session.miles;
}
function confetti(){
  const cv=document.getElementById('confetti'),ctx=cv.getContext('2d');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  cv.width=innerWidth;cv.height=innerHeight;
  const colors=['#5b55e8','#ff6f86','#21b89a','#f5b224','#3aa0f0'];
  const ps=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,w:5+Math.random()*6,h:8+Math.random()*8,vy:2+Math.random()*3,vx:-1.5+Math.random()*3,r:Math.random()*6,vr:-.15+Math.random()*.3,c:pick(colors)}));
  const start=performance.now();
  (function frame(t){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(t-start<3200)requestAnimationFrame(frame);else ctx.clearRect(0,0,cv.width,cv.height);
  })(start);
}

      <div class="progress"><div style="width:${pct}%"></div></div>

      <button class="btn xl" onclick="startAdventure()">${t&&t.done?'오늘 단어 한 번 더':'미션 시작'} <span class="muted" style="color:rgba(255,255,255,.75);font-weight:500">· 단어 ${ready}개</span></button>

function pickerHtml(p){return `<div id="${p}-picker">${pickerInner(p)}</div>`;}
function pickerInner(p){

  return `<div class="pk-tabs" role="tablist">${Object.keys(PICKER).map(c=>`<button type="button" class="pk-tab ${c===st.cat?'on':''}" onclick="pickerCat('${p}','${c}')">${c}</button>`).join('')}</div>

    ${st.emoji?`<button type="button" class="btn ghost sm" onclick="pickerClear('${p}')">그림 빼기</button>`:''}`;

function pickerCat(p,c){pickState[p].cat=c;document.getElementById(p+'-picker').innerHTML=pickerInner(p);}
function pickerSync(p){
  document.getElementById(p+'-picker').innerHTML=pickerInner(p);
  const sel=document.getElementById(p+'-sel');if(sel)sel.textContent=pickState[p].emoji;
  const v=document.getElementById(p+'-val');if(v)v.value=pickState[p].emoji;

function pickerClear(p){pickState[p].emoji='';pickerSync(p);}
function photoHtml(p){return `<div class="photo-row" id="${p}-photo">${photoInner(p)}</div>`;}
function photoInner(p){
  const u=photoState[p];
  return u?`<img class="photo-prev" src="${esc(u)}" alt="올린 사진"><button type="button" class="btn ghost sm" onclick="removePhoto('${p}')">사진 빼기</button>`
    :`<label class="btn ghost sm photo-btn">📷 사진 올리기<input type="file" accept="image/*" hidden onchange="handlePhoto('${p}',this)"></label><span class="muted small">사진이 있으면 그림 대신 사진이 나와요</span>`;
}
function resizeImage(file,max=240){
  return new Promise((res,rej)=>{
    const fr=new FileReader();fr.onerror=rej;
    fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.82));
    };img.src=fr.result;};
    fr.readAsDataURL(file);
  });
}
async function handlePhoto(p,input){
  const f=input.files&&input.files[0];if(!f)return;
  try{photoState[p]=await resizeImage(f);}catch(e){await alertBox('이 파일은 사진으로 쓸 수 없어요. 다른 사진을 골라주세요.');return;}
  document.getElementById(p+'-photo').innerHTML=photoInner(p);
}
function removePhoto(p){photoState[p]='';document.getElementById(p+'-photo').innerHTML=photoInner(p);}

/* ===================== 단어 넣기 ===================== */
function isDuplicate(en,exceptId){
  const t=todayObj();const hit=w=>w.en===en&&w.id!==exceptId;
  return S.adminQueue.some(hit)||S.childQueue.some(hit)||(t&&!t.done&&t.words.some(hit));
}
function listFor(q){
  if(q==='admin')return S.adminQueue;
  if(q==='child')return S.childQueue;
  const t=todayObj();return t&&!t.done?t.words:[];
}
const cleanEn=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ').replace(/’/g,"'");
const validEn=en=>/^[a-z][a-z '\-]*$/.test(en);

async function checkWord(en,ko,exceptId){
  if(!en){await alertBox('영어 단어를 적어주세요.');return false;}
  if(!validEn(en)){await alertBox(`‘${esc(en)}’에 영어 알파벳이 아닌 글자가 있어요. 영어로만 적어주세요.`);return false;}
  if(!ko){await alertBox(`‘${esc(en)}’의 뜻을 적어주세요.`);return false;}
  if(isDuplicate(en,exceptId)){await alertBox(`‘${esc(en)}’은(는) 이미 단어 주머니에 있어요.`);return false;}
  return true;
}
async function prepareWord(input,source){
  const en=cleanEn(input.en),ko=String(input.ko||'').trim();
  if(!(await checkWord(en,ko)))return null;
  const ex=String(input.ex||'').trim();
  return {id:uid(),en,ko,emojis:input.emojis||[],img:input.img||'',ex,exKo:ex?String(input.exKo||'').trim():'',source};
}

function goWords(tab){
  setScene(false);
  pickState.c={cat:'동물',emoji:''};photoState.c='';photoState.a='';
  const tabs=`<div class="tabs" role="tablist">
    <button class="tab ${tab==='child'?'on':''}" onclick="goWords('child')">✍️ 내 단어</button>

}

/* ===================== 미션 ===================== */
function buildToday(){
  if(todayObj())return true;
  if(pouchCount()<MIN_WORDS)return false;
  const words=[];
  while(words.length<DAILY&&S.adminQueue.length)words.push(S.adminQueue.shift());
  while(words.length<DAILY&&S.childQueue.length)words.push(S.childQueue.shift());
  S.today={date:todayStr(),words,done:false,city:cityFor(todayStr()).key};save();
  return true;
}
function pickGames(words,avoid=[]){
  const ok={
    listen:canSpeak,dict:canSpeak,
    emoji:words.filter(hasPic).length>=MIN_WORDS,
    blank:words.filter(hasEx).length>=MIN_WORDS
  };
  ok.speak=false;
  const recent=new Set([...(S.lastGames||[]),...avoid]);
  /* 최근에 한 게임은 뒤로 보내서 매일 다른 게임이 나오게 해요 */
  const rest=shuffle(Object.keys(GAME_INFO).filter(g=>ok[g]!==false)).sort((a,b)=>(recent.has(a)?1:0)-(recent.has(b)?1:0));
  return canListen?shuffle(['speak',...rest.slice(0,3)]):shuffle(rest.slice(0,4));
}
const ROUND_GAMES=['match','connect'];
function buildGameQs(games,words){
  const qs=[];
  games.forEach((g,gi)=>{
    if(ROUND_GAMES.includes(g)){qs.push({type:g,word:null,phase:'game',gameNo:gi,qNo:0,total:1});return;}
    const pool=g==='blank'?words.filter(hasEx):g==='emoji'?words.filter(hasPic):words;
    shuffle(pool).forEach((w,qi)=>qs.push({type:g,word:w,phase:'game',gameNo:gi,qNo:qi,total:pool.length}));
  });
  return qs;
}
function rerollGames(){
  session.games=pickGames(session.words,session.games.filter(g=>g!=='speak'));
  session.gameQs=buildGameQs(session.games,session.words);
  showToday();toast('게임을 바꿨어요');
}
function buildReview(){
  const todaySet=new Set(S.today.words.map(w=>w.en));
  const list=[];
  Object.entries(S.wrong).filter(([en,c])=>c>0&&S.wordBook[en]&&!todaySet.has(en)).sort((a,b)=>b[1]-a[1]).forEach(([en])=>list.push(en));
  const last=[...S.history].reverse().find(h=>h.date!==todayStr());
  if(last)shuffle(last.words.map(w=>w.en)).forEach(en=>{if(S.wordBook[en]&&!todaySet.has(en))list.push(en);});
  return uniq(list).slice(0,3).map(en=>S.wordBook[en]);
}

async function startAdventure(){
  if(!buildToday()){
    const n=pouchCount();
    const go=await confirmBox(`단어 주머니에 단어가 ${n}개 있어요.<br>미션을 시작하려면 최소 ${MIN_WORDS}개가 필요해요.`,'단어 넣으러 가기','닫기');
    if(go)goWords('child');
    return;
  }
  const t=S.today;
  if(t.done&&!(await confirmBox('오늘 미션은 이미 완료했어요.<br>같은 단어로 한 번 더 연습할까요? (XP는 그대로 쌓여요)','한 번 더','다음에')))return;
  const games=pickGames(t.words),review=buildReview();
  const reviewQs=review.map((w,i)=>({type:hasPic(w)&&Math.random()<.5?'emoji':'meaning',word:w,phase:'review',qNo:i,total:review.length}));
  const gameQs=buildGameQs(games,t.words);
  session={words:t.words,games,reviewQs,gameQs,phase:reviewQs.length?'review':'game',qi:0,earned:0,miles:0,wrongSet:new Set(),attempts:0,locked:false,opts:[]};
  if(reviewQs.length)showReviewIntro();else showToday();
}

/* ===================== 문제 공통 ===================== */
function curQ(){return (session.phase==='review'?session.reviewQs:session.gameQs)[session.qi];}
function recordStat(type,right){
  if(session.phase!=='game')return;
  const g=S.gameStats[type]||(S.gameStats[type]={right:0,total:0});
  g.total++;if(right)g.right++;save();
}
function distractors(field,w,n){
  const correct=w[field].toLowerCase();
  const near=shuffle(session.words.filter(x=>x.en!==w.en).map(x=>x[field]));
  const far=shuffle([...Object.values(S.wordBook),...S.adminQueue,...S.childQueue].filter(x=>x.en!==w.en).map(x=>x[field]));
  return uniq([...near,...far].filter(v=>v&&v.toLowerCase()!==correct)).slice(0,n);
}

function renderQuestion(){
  setScene(true);
  const q=curQ(),w=q.word;
  session.attempts=0;session.locked=false;
  const total=session.phase==='game'?session.gameQs.length:session.reviewQs.length;
  const isLast=session.qi===total-1;
  const head=`${topBar()}
    <div class="game-head"><span class="tag">${q.phase==='review'?'복습':`게임 ${q.gameNo+1}/${session.games.length} · ${GAME_INFO[q.type].name}`}</span>
      <span class="muted">${q.type==='match'?'한 판':`${q.qNo+1}/${q.total}`}${q.phase==='game'?` · ✈️ <span class="en-font" id="mileCount">${session.miles}</span> mi`:''}</span></div>
    <div class="progress"><div style="width:${Math.round(session.qi/total*100)}%"></div></div>`;
  const intro=q.phase==='review'?(q.qNo===0?'지난번에 배운 단어예요. 기억나요?':pick(CHEER)):(q.qNo===0?GAME_INFO[q.type].how:pick(CHEER));
  const nextLabel=isLast?(session.phase==='review'?'오늘의 미션 시작':'결과 보기'):'다음';
  const nextWrap=`<div class="next-wrap" id="nextWrap"><button class="btn xl" onclick="nextQuestion()">${nextLabel}</button></div>`;
  const ctx={q,head:head+lucy(intro,q.qNo===0?'hi':'cheer'),nextWrap};
  if(q.type==='speak')return renderSpeak(ctx);
  if(q.type==='type'||q.type==='dict')return renderType(ctx);
  if(q.type==='ox')return renderOX(ctx);
  if(q.type==='connect')return renderConnect(ctx);
  if(q.type==='vault')return renderVault(ctx);
  if(q.type==='scramble')return renderScramble(ctx);
  if(q.type==='match')return renderMatch(ctx);
  if(q.type==='balloon')return renderBalloon(ctx);
  if(q.type==='missing')return renderMissing(ctx);

  const field=q.type==='meaning'?'ko':'en';
  session.opts=shuffle([{label:w[field],correct:true},...distractors(field,w,2).map(v=>({label:v,correct:false}))]);
  let prompt='';
  if(q.type==='meaning')prompt=`<div class="q-word">${esc(w.en)} ${speakBtn(w.en)}</div><p class="q-sub">이 단어의 뜻은?</p>`;
  else if(q.type==='blank'){
    const s=esc(w.ex.replace(wordRx(w.en),'_____')).replace('_____','<span class="blank">?</span>');
    prompt=`<div class="q-sentence">${s}</div><p class="q-sub">${w.exKo?esc(w.exKo):`힌트: ${esc(w.ko)}`}</p>`;
  }
  else if(q.type==='emoji')prompt=`${pic(w)}<p class="q-sub">이 그림에 맞는 영어 단어는?</p>`;
  else if(q.type==='listen')prompt=`<button class="big-speak" data-say="${esc(w.en)}" onclick="speak(this.dataset.say)" aria-label="소리 듣기">🔊</button><p class="q-sub">발음을 듣고 맞는 단어를 고르세요.</p>`;
  const keys='ABCD';
  render(`${ctx.head}
    <div class="card q-card">${prompt}</div>
    <div class="opts">${session.opts.map((o,i)=>`<button class="opt ${field==='en'?'en-opt':''}" data-i="${i}" onclick="choose(${i})"><span class="k">${keys[i]}</span><span>${esc(o.label)}</span></button>`).join('')}</div>
    ${nextWrap}`);
  if(q.type==='listen')setTimeout(()=>speak(w.en),350);
}

function markWrong(w){S.wrong[w.en]=(S.wrong[w.en]||0)+1;session.wrongSet.add(w.en);save();}
function onCorrect(el){
  const q=curQ(),w=q.word;
  session.earned++;
  if(q.phase==='review'&&session.attempts===0&&S.wrong[w.en]){S.wrong[w.en]--;if(S.wrong[w.en]<=0)delete S.wrong[w.en];}
  giveXP(el);giveMile();
  setLucy(pick(PRAISE)+(session.attempts?' 힌트 잘 썼어요.':''),'praise');
  speak(w.en);showNext();
}
function onFinalWrong(){
  const w=curQ().word;
  setLucy(`정답은 <b class="en-font">${esc(w.en)}</b> (${esc(w.ko)})예요. 다음엔 맞힐 수 있어요.`,'cheer');
  speak(w.en);showNext();
}
function hintText(q){
  const w=q.word;
  if(q.type==='meaning')return `아쉽네요. 힌트: 뜻의 첫 글자는 ‘${[...w.ko][0]}’.`;
  if(q.type==='listen'){speak(w.en);return `아쉽네요. 한 번 더 들려줄게요. 힌트: 첫 글자는 ‘${w.en[0]}’.`;}
  return `아쉽네요. 힌트: 첫 글자는 ‘${w.en[0]}’.`;
}
function answer(i,el,sel){
  if(session.locked)return false;
  const o=session.opts[i],q=curQ();
  if(o.correct){
    session.locked=true;el.classList.add('right');
    document.querySelectorAll(sel).forEach(b=>b.disabled=true);
    recordStat(q.type,session.attempts===0);onCorrect(el);return true;
  }
  session.attempts++;el.classList.add('wrong');el.disabled=true;
  if(session.attempts===1){markWrong(q.word);setLucy(hintText(q),'hint');}
  else{
    session.locked=true;
    document.querySelectorAll(sel).forEach(b=>{b.disabled=true;if(session.opts[+b.dataset.i].correct)b.classList.add('right');});
    recordStat(q.type,false);onFinalWrong();
  }
  return false;
}
function choose(i){answer(i,document.querySelector(`.opt[data-i="${i}"]`),'.opt');}
function showNext(){const n=document.getElementById('nextWrap');if(n){n.classList.add('show');setTimeout(()=>{try{n.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}},100);}}
function nextQuestion(){
  if(canSpeak)try{speechSynthesis.cancel();}catch(e){}
  session.qi++;
  const arr=session.phase==='review'?session.reviewQs:session.gameQs;
  if(session.qi>=arr.length){if(session.phase==='review')showToday();else finish();}
  else renderQuestion();
}

function renderSpeak({q,head,nextWrap}){
  const w=q.word;session.sp={tries:0};
  render(`${head}
    <div class="card q-card">
      <div style="font-size:.75em">${pic(w)}</div>
      <div class="q-word" style="margin-top:6px">${esc(w.en)} ${speakBtn(w.en)}</div>

      <div class="mic-label" id="spMicLabel">눌러서 따라 말하기</div>
      <div id="spFb"></div>
      <div style="margin-top:12px" id="skipWrap"><button class="btn ghost sm" onclick="speakSkip()">이번 단어 건너뛰기</button></div>
    </div>${nextWrap}`);
  setTimeout(()=>speak(w.en),350);
}
async function speakTry(){
  if(session.locked||listening)return;
  const w=curQ().word,fb=document.getElementById('spFb');
  setMic('spMic',true);const r=await listenOnce();setMic('spMic',false);
  if(!session||session.locked||!document.getElementById('spFb'))return;
  if(r.error){fb.innerHTML=`<div class="sp-err">${speechErrText(r.error)}</div>`;return;}
  const ev=evaluateSpeech(w.en,r.alts);
  session.sp.tries++;saveSpeakScore(w.en,ev.score);
  fb.innerHTML=speechFbHtml(ev);
  const left=3-session.sp.tries,mic=document.getElementById('spMic');
  if(ev.level!=='retry'){
    session.locked=true;mic.disabled=true;document.getElementById('skipWrap').remove();
    recordStat('speak',session.sp.tries===1);
    session.earned++;giveXP(mic);giveMile();
    setLucy(ev.level==='excellent'?pick(['발음 완벽해요! 원어민 같아요. 🎧','정확해요! 100% 알아들었어요.','깔끔한 발음이에요. 💯']):'통과! 잘 들렸어요. 🔊로 한 번 더 들어보면 더 정확해질 거예요.','praise');
    showNext();
  }else if(left<=0){
    session.locked=true;mic.disabled=true;document.getElementById('skipWrap').remove();
    recordStat('speak',false);S.speakHard[w.en]=(S.speakHard[w.en]||0)+1;save();
    setLucy('괜찮아요. 이 단어는 다음에 또 연습해요. 정확한 발음을 한 번 더 들려줄게요.','cheer');
    setTimeout(()=>speak(w.en),600);showNext();
  }else{
    setLucy(`루시에게는 ‘${esc(ev.heard)}’로 들렸어요. 발음을 다시 듣고 천천히 또박또박 말해보세요. (남은 기회 ${left}번)`,'hint');
    setTimeout(()=>speak(w.en),700);
  }
}
function speakSkip(){
  if(session.locked)return;
  session.locked=true;
  const m=document.getElementById('spMic');if(m)m.disabled=true;
  const s=document.getElementById('skipWrap');if(s)s.remove();
  setLucy('건너뛰었어요. 조용한 곳에서 다시 연습해봐요.','cheer');showNext();
}

        :`<div style="font-size:.7em">${pic(w)}</div><div class="q-word ko" style="font-size:1.7rem;margin-top:6px">${esc(w.ko)}</div><p class="q-sub">이 뜻의 영어 단어를 쓰세요.</p>`}
      <div class="type-row"><input id="typeIn" class="input en-in type-in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력" aria-label="영어 단어 입력" onkeydown="if(event.key==='Enter')typeCheck()"><button class="btn" onclick="typeCheck()">확인</button></div>

const maskOf=en=>[...en].map((c,i)=>c===' '?'&nbsp;':(i===0?esc(c):'_')).join(' ');
function typeCheck(){
  if(session.locked)return;
  const q=curQ(),w=q.word,inp=document.getElementById('typeIn'),v=cleanEn(inp.value);
  if(!v){toast('먼저 영어로 입력하세요');return;}
  if(v===w.en){session.locked=true;inp.disabled=true;inp.classList.add('ok');recordStat(q.type,session.attempts===0);onCorrect(inp);return;}
  session.attempts++;
  inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');
  const len=w.en.replace(/[^a-z]/g,'').length;
  if(session.attempts===1){
    markWrong(w);
    document.getElementById('typeHint').innerHTML=`<span class="en-font">${maskOf(w.en)}</span> <span class="muted small">(${len}글자)</span>`;
    const close=lev(v,w.en)<=1;
    setLucy(close?'거의 맞았어요! 딱 한 글자만 달라요. 다시 확인해보세요.':`아쉽네요. 힌트: 첫 글자는 ‘${w.en[0]}’, 모두 ${len}글자예요.${q.type==='dict'?` 뜻은 ‘${esc(w.ko)}’이에요.`:''}`,'hint');
    if(q.type==='dict')speak(w.en);
    inp.select();
  }else{
    session.locked=true;inp.disabled=true;recordStat(q.type,false);
    document.getElementById('typeHint').innerHTML=`정답 <b class="en-font">${esc(w.en)}</b>`;
    onFinalWrong();
  }
}

function renderConnect({head,nextWrap}){

  render(`${head}
    <div class="cn-grid">
      <div class="cn-col">${shuffle(ws).map(w=>`<button class="cn en" data-id="${w.id}" data-side="L" onclick="cnTap(this)">${esc(w.en)}</button>`).join('')}</div>
      <div class="cn-col">${shuffle(ws).map(w=>`<button class="cn" data-id="${w.id}" data-side="R" onclick="cnTap(this)">${esc(w.ko)}</button>`).join('')}</div>

function cnTap(el){
  const cn=session.cn;if(el.classList.contains('done'))return;
  const w=session.words.find(x=>x.id===el.dataset.id);
  if(el.dataset.side==='L')speak(w.en);
  if(!cn.sel||cn.sel===el||cn.sel.dataset.side===el.dataset.side){
    if(cn.sel)cn.sel.classList.remove('sel');
    if(cn.sel===el){cn.sel=null;return;}
    cn.sel=el;el.classList.add('sel');return;
  }
  const a=cn.sel;cn.sel=null;a.classList.remove('sel');
  if(a.dataset.id===el.dataset.id){
    const k='c'+(cn.pairs%5);
    [a,el].forEach(b=>{b.classList.add('done',k);b.disabled=true;});
    cn.pairs++;recordStat('connect',true);session.earned++;giveXP(el);giveMile();
    if(cn.pairs===session.words.length){setLucy('전부 연결 완료! 🎉','party');showNext();}
    else setLucy(`${pick(PRAISE)} <b class="en-font">${esc(w.en)}</b> = ${esc(w.ko)}`,'praise');
  }else{
    recordStat('connect',false);
    [a,el].forEach(b=>{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');});

  }
}

/* ===================== 단어 금고 ===================== */
function renderVault({q,head,nextWrap}){
  const w=q.word;
  session.vt={guessed:[],lives:6,letters:uniq(w.en.replace(/[^a-z]/g,'').split(''))};
  render(`${head}
    <div class="card q-card">
      <div style="font-size:.6em">${pic(w)}</div>
      <div class="q-word ko" style="font-size:1.6rem;margin-top:4px">${esc(w.ko)}</div>
      <div class="lives" id="vtLives"></div>
      <div class="slots" id="vtSlots"></div>
      <div class="kb" id="vtKb"></div>
    </div>${nextWrap}`);
  drawVault(false);
}
function drawVault(reveal){
  const vt=session.vt,w=curQ().word;
  document.getElementById('vtLives').textContent='남은 기회 '+'❤️'.repeat(vt.lives)+'🤍'.repeat(6-vt.lives);
  document.getElementById('vtSlots').innerHTML=[...w.en].map(ch=>{
    if(ch===' ')return '<div class="slot gap"></div>';
    if(!/[a-z]/.test(ch))return `<div class="slot fixed">${esc(ch)}</div>`;
    const show=reveal||vt.guessed.includes(ch);
    return `<div class="slot ${show?'fill':''}">${show?ch:''}</div>`;
  }).join('');
  document.getElementById('vtKb').innerHTML=['qwertyuiop','asdfghjkl','zxcvbnm'].map(r=>`<div class="kb-row">${[...r].map(c=>{
    const g=vt.guessed.includes(c),cls=g?(vt.letters.includes(c)?'hit':'miss'):'';
    return `<button class="key ${cls}" onclick="vtGuess('${c}')" ${g||session.locked?'disabled':''}>${c}</button>`;}).join('')}</div>`).join('');
}
function vtGuess(ch){
  const vt=session.vt,q=curQ(),w=q.word;
  if(session.locked||vt.guessed.includes(ch))return;
  vt.guessed.push(ch);
  if(vt.letters.includes(ch)){
    if(vt.letters.every(c=>vt.guessed.includes(c))){
      session.locked=true;drawVault(false);
      const sl=document.getElementById('vtSlots');sl.classList.add('right');
      recordStat('vault',true);onCorrect(sl);return;
    }
    setLucy(pick(['좋아요, 들어 있어요!','맞아요. 계속 가볼까요?','나이스! 다음 글자는?']),'praise');
  }else{
    vt.lives--;
    if(vt.lives<=0){
      session.locked=true;markWrong(w);recordStat('vault',false);drawVault(true);
      document.getElementById('vtSlots').classList.add('reveal');onFinalWrong();return;
    }
    setLucy(`‘${ch}’는 없어요. 남은 기회 ${vt.lives}번.${vt.lives===2?` 힌트: 첫 글자는 ‘${w.en[0]}’.`:''}`,'hint');
  }
  drawVault(false);
}

/* ===================== 철자 맞추기 ===================== */
function renderScramble({q,head,nextWrap}){
  const w=q.word,target=w.en.replace(/[^a-z]/g,'');
  let tiles=target.split('');
  for(let k=0;k<12;k++){tiles=shuffle(tiles);if(tiles.join('')!==target||target.length<2)break;}
  session.sc={target,tiles,picked:[],locked:0,reveal:false};
  render(`${head}
    <div class="card q-card">
      <div style="font-size:.7em">${pic(w)}</div>
      <div class="q-word ko" style="font-size:1.5rem;margin-top:8px">${esc(w.ko)}</div>
      <div class="slots" id="slots"></div>
      <div class="tiles" id="tiles"></div>
      <button class="btn ghost sm" onclick="scUndo()">하나 지우기</button>
    </div>${nextWrap}`);
  drawSc();
}
function drawSc(){
  const sc=session.sc;
  document.getElementById('slots').innerHTML=sc.target.split('').map((ch,i)=>{
    const letter=sc.reveal?ch:(sc.picked[i]!=null?sc.tiles[sc.picked[i]]:'');
    return `<div class="slot ${letter?'fill':''} ${i<sc.locked&&!sc.reveal?'lock':''}">${letter}</div>`;
  }).join('');
  document.getElementById('tiles').innerHTML=sc.tiles.map((ch,i)=>`<button class="tile" onclick="scTap(${i})" ${sc.picked.includes(i)||session.locked?'disabled':''}>${ch}</button>`).join('');
}
function scTap(i){const sc=session.sc;if(session.locked||sc.picked.includes(i))return;sc.picked.push(i);drawSc();if(sc.picked.length===sc.target.length)scCheck();}
function scUndo(){const sc=session.sc;if(session.locked)return;if(sc.picked.length>sc.locked){sc.picked.pop();drawSc();}}
function scCheck(){
  const sc=session.sc,q=curQ(),slots=document.getElementById('slots');
  if(sc.picked.map(i=>sc.tiles[i]).join('')===sc.target){
    session.locked=true;drawSc();document.getElementById('slots').classList.add('right');
    recordStat('scramble',session.attempts===0);onCorrect(document.getElementById('slots'));return;
  }
  session.attempts++;
  slots.classList.remove('shake');void slots.offsetWidth;slots.classList.add('shake');
  if(session.attempts===1){
    markWrong(q.word);
    setLucy(`아쉽네요. 첫 글자 ‘${sc.target[0]}’를 넣어 둘게요. 나머지를 다시 맞춰보세요.`,'hint');
    setTimeout(()=>{sc.picked=[sc.tiles.indexOf(sc.target[0])];sc.locked=1;drawSc();},600);
  }else{
    session.locked=true;recordStat('scramble',false);
    setTimeout(()=>{sc.reveal=true;drawSc();document.getElementById('slots').classList.add('reveal');onFinalWrong();},500);
  }
}

function mFlip(i){
  const mt=session.mt,el=document.querySelector(`.mcard[data-i="${i}"]`);
  if(mt.busy||el.classList.contains('done')||mt.open.includes(i))return;
  el.classList.add('flipped');mt.open.push(i);

  if(mt.open.length<2)return;
  const [a,b]=mt.open,ca=mt.cards[a],cb=mt.cards[b];

    recordStat('match',true);
    ea.classList.add('done');eb.classList.add('done');mt.pairs++;session.earned++;
    giveXP(eb);giveMile();speak(ca.w.en);
    if(mt.pairs===session.words.length){setLucy('전부 매칭 완료! 기억력 좋네요. 🎉','party');showNext();}
    else setLucy(`${pick(PRAISE)} <b class="en-font">${esc(ca.w.en)}</b> = ${esc(ca.w.ko)}`,'praise');
  }else{
    recordStat('match',false);mt.busy=true;
    setLucy(pick(['짝이 아니에요. 위치를 기억해 두세요.','아쉽네요. 다시 찾아보세요.','거의 다 왔어요. 카드 위치를 떠올려 보세요.']),'hint');
    setTimeout(()=>{ea.classList.remove('flipped');eb.classList.remove('flipped');mt.busy=false;},950);
  }
}

function popBalloon(i){
  if(session.locked)return;
  const el=document.querySelector(`.bubble-b[data-i="${i}"]`);
  if(session.opts[i].correct){
    let y=0;
    try{const tf=getComputedStyle(el).transform;if(tf&&tf!=='none'&&window.DOMMatrixReadOnly)y=new DOMMatrixReadOnly(tf).m42||0;}catch(e){}
    el.style.setProperty('--y',y+'px');
  }
  if(answer(i,el,'.bubble-b')){
    el.classList.add('popped');
    const area=document.getElementById('skyArea'),ar=area.getBoundingClientRect(),r=el.getBoundingClientRect();
    const b=document.createElement('div');b.className='boom';b.textContent='POP!';
    b.style.left=(r.left-ar.left+r.width/2)+'px';b.style.top=Math.max(10,r.top-ar.top)+'px';
    area.appendChild(b);setTimeout(()=>b.remove(),1000);
  }
}

/* ===================== 빠진 글자 ===================== */
function renderMissing({q,head,nextWrap}){
  const w=q.word,target=w.en;
  const idxs=[...target].map((c,i)=>/[a-z]/.test(c)?i:-1).filter(i=>i>=0);
  const n=idxs.length<=4?1:idxs.length<=8?2:3;
  const blanks=shuffle(idxs).slice(0,n).sort((a,b)=>a-b);
  const need=uniq(blanks.map(i=>target[i]));
  const pool=shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(c=>!need.includes(c))).slice(0,Math.max(4,7-need.length));
  session.ms={target,blanks,letters:shuffle([...need,...pool]),need,fill:[],removed:[],reveal:false};
  render(`${head}
    <div class="card q-card">
      <div style="font-size:.7em">${pic(w)}</div>
      <div class="q-word ko" style="font-size:1.5rem;margin-top:8px">${esc(w.ko)}</div>
      <div class="slots" id="msSlots"></div>
      <div class="tiles" id="msLetters"></div>
      <button class="btn ghost sm" onclick="msUndo()">하나 지우기</button>
    </div>${nextWrap}`);
  drawMs();
}
function drawMs(){
  const ms=session.ms;
  document.getElementById('msSlots').innerHTML=[...ms.target].map((ch,i)=>{
    if(ch===' ')return '<div class="slot gap"></div>';
    const k=ms.blanks.indexOf(i);
    if(k<0)return `<div class="slot fixed">${esc(ch)}</div>`;
    const letter=ms.reveal?ch:(ms.fill[k]||'');
    return `<div class="slot hole ${letter?'fill':''}">${letter||'?'}</div>`;
  }).join('');
  document.getElementById('msLetters').innerHTML=ms.letters.map(ch=>`<button class="tile" onclick="msTap('${ch}')" ${ms.removed.includes(ch)||session.locked?'disabled':''}>${ch}</button>`).join('');
}
function msTap(ch){const ms=session.ms;if(session.locked||ms.fill.length>=ms.blanks.length)return;ms.fill.push(ch);drawMs();if(ms.fill.length===ms.blanks.length)msCheck();}
function msUndo(){const ms=session.ms;if(session.locked||!ms.fill.length)return;ms.fill.pop();drawMs();}
function msCheck(){
  const ms=session.ms,q=curQ(),slots=document.getElementById('msSlots');
  if(ms.blanks.every((p,k)=>ms.fill[k]===ms.target[p])){
    session.locked=true;drawMs();document.getElementById('msSlots').classList.add('right');
    recordStat('missing',session.attempts===0);onCorrect(document.getElementById('msSlots'));return;
  }
  session.attempts++;
  slots.classList.remove('shake');void slots.offsetWidth;slots.classList.add('shake');
  if(session.attempts===1){
    markWrong(q.word);
    ms.removed=shuffle(ms.letters.filter(c=>!ms.need.includes(c))).slice(0,2);
    setLucy('아쉽네요. 아닌 글자 2개를 지웠어요. 다시 골라보세요.','hint');
    setTimeout(()=>{ms.fill=[];drawMs();},600);
  }else{
    session.locked=true;recordStat('missing',false);
    setTimeout(()=>{ms.reveal=true;drawMs();document.getElementById('msSlots').classList.add('reveal');onFinalWrong();},500);
  }
}

/* ===================== 결과 ===================== */
function finish(){
  const t=S.today,td=todayStr(),c=curCity();
  t.done=true;S.lastGames=[...session.games];
  t.words.forEach(w=>{S.wordBook[w.en]={en:w.en,ko:w.ko,emojis:[...w.emojis],img:w.img||'',ex:w.ex,exKo:w.exKo};});
  if(S.lastStudy!==td){S.streak=S.lastStudy===yesterdayStr()?S.streak+1:1;S.lastStudy=td;}
  let h=S.history.find(x=>x.date===td);
  if(!h){h={date:td,words:t.words.map(w=>({en:w.en,ko:w.ko,source:w.source})),wrong:[],stars:0,plays:0,miles:0,city:c.key};S.history.push(h);}
  h.stars+=session.earned;h.plays++;h.miles=(h.miles||0)+session.miles;h.wrong=uniq([...h.wrong,...session.wrongSet]);
  save();
  const pouch=[...S.adminQueue,...S.childQueue],nl=nextLevel(S.stars);
  const stamps=S.history.length;
  render(`${topBar()}${lucy(`미션 완료! ${nmHi()?nmHi()+', ':''}수고했어요. 내일 또 만나요.`,'party')}
    <div class="card center">
      <div class="stamp"><div class="ic">${c.icon}</div><div class="city">${c.name}</div><div class="date">${td.replace(/-/g,'.')}</div></div>
      <p class="muted small" style="margin:0">지금까지 모은 스탬프 ${stamps}개</p>
    </div>
    <div class="result-stats">
      <div class="stat"><div class="muted small">오늘 얻은 XP</div><div class="v">+${session.earned}</div></div>
      <div class="stat"><div class="muted small">오늘 마일리지</div><div class="v">✈️ ${session.miles} mi</div></div>
    </div>
    <div class="card">
      <div class="row between"><div><div class="muted small">현재 레벨</div><div class="en-font" style="font-size:1.3rem;font-weight:700;color:var(--ink)">${levelName(S.stars)}</div></div><div class="muted small">${nl?`다음 레벨까지 ${nl.n-S.stars} XP`:'최고 레벨'}</div></div>
    </div>
    <div class="card">
      <h3>오늘 외운 단어</h3>
      <ul class="wlist">${t.words.map(w=>`<li>${thumb(w)}<span class="grow"><span class="en">${esc(w.en)}</span> <span class="ko">${esc(w.ko)}</span></span>${speakBtn(w.en)}</li>`).join('')}</ul>
    </div>
    <div class="card">
      <h3>다음 미션 단어 주머니 <span class="muted small">${pouch.length}개</span></h3>
      ${pouch.length?`<div class="chips">${pouch.map(w=>`<span class="chip">${chipPic(w)} ${esc(w.en)}</span>`).join('')}</div>${pouch.length<MIN_WORDS?`<p class="muted small" style="margin-top:8px">다음 미션을 하려면 ${MIN_WORDS-pouch.length}개 더 필요해요.</p>`:''}`:`<p class="muted">비어 있어요. 다음 미션을 하려면 단어를 최소 ${MIN_WORDS}개 넣어주세요.</p>`}
    </div>
    <div class="home-btns">
      <button class="btn coral xl" onclick="goWords('child')">✍️ 다음 단어 넣기</button>
      <button class="btn ghost" onclick="goHome()">처음으로</button>
    </div>`);
  confetti();
}

/* ===================== 운영자 기록 ===================== */
function goRecords(){
  setScene(false);
  if(!adminUnlocked)return render(topBar()+pinGateHtml('records'));
  const wrongTop=Object.entries(S.wrong).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const hist=[...S.history].reverse();
  const gs=Object.keys(GAME_INFO).map(k=>({k,...(S.gameStats[k]||{right:0,total:0})})).filter(x=>x.total>0).map(x=>({...x,pct:Math.round(x.right/x.total*100)}));
  const hard=gs.filter(x=>x.total>=3).sort((a,b)=>a.pct-b.pct)[0];
  render(`${topBar()}
    <h2>운영자 기록</h2>
    <div class="result-stats">
      <div class="stat"><div class="muted small">연속 학습</div><div class="v">🔥 ${curStreak()}일</div></div>
      <div class="stat"><div class="muted small">누적 XP</div><div class="v">${S.stars}</div></div>
      <div class="stat"><div class="muted small">외운 단어</div><div class="v">${Object.keys(S.wordBook).length}</div></div>
      <div class="stat"><div class="muted small">레벨</div><div class="v" style="font-size:1.1rem">${levelName(S.stars)}</div></div>
    </div>
    <div class="card">
      <h3>게임별 정답률</h3>
      ${gs.length?`${gs.map(x=>`<div class="gstat"><span>${GAME_INFO[x.k].name}</span><div class="progress"><div style="width:${x.pct}%"></div></div><span class="num">${x.pct}% (${x.right}/${x.total})</span></div>`).join('')}
        <p class="muted small" style="margin-top:8px">한 번에 맞힌 비율이에요. 카드 매칭과 짝 연결은 시도한 횟수 중 짝을 맞힌 비율, 단어 금고는 기회 안에 맞힌 비율, 따라 말하기는 첫 시도에 75점을 넘은 비율이에요.${hard&&hard.pct<70?` 요즘은 <b>${GAME_INFO[hard.k].name}</b>을(를) 어려워해요.`:''}</p>`
        :'<p class="muted">아직 기록이 없어요. 게임을 하면 쌓여요.</p>'}
    </div>
    <div class="card">
      <h3>발음 연습이 필요한 단어</h3>
      ${(()=>{const hard=Object.entries(S.speakHard).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]).slice(0,10);
        return hard.length?`<ul class="wlist">${hard.map(([en,c])=>{const w=normWord(S.wordBook[en]?{...S.wordBook[en]}:{en,ko:'',emojis:[]});return `<li>${thumb(w)}<span class="grow"><span class="en">${esc(en)}</span> <span class="ko">${esc(w.ko)}</span></span><span class="muted small">최고 ${S.speakBest[en]||0}점</span><span class="badge child">${c}번 실패</span></li>`;}).join('')}</ul><p class="muted small" style="margin-top:8px">따라 말하기에서 3번 안에 75점을 넘지 못한 단어예요.</p>`
        :`<p class="muted">${canListen?'아직 없어요.':'이 브라우저는 음성 인식을 지원하지 않아요.'}</p>`;})()}
    </div>
    <div class="card">
      <h3>자주 틀린 단어</h3>
      ${wrongTop.length?`<ul class="wlist">${wrongTop.map(([en,c])=>{const w=normWord(S.wordBook[en]?{...S.wordBook[en]}:{en,ko:'',emojis:[]});return `<li>${thumb(w)}<span class="grow"><span class="en">${esc(en)}</span> <span class="ko">${esc(w.ko)}</span></span><span class="badge child">${c}번</span></li>`;}).join('')}</ul><p class="muted small" style="margin-top:8px">다음 미션의 복습에 먼저 나와요. 복습에서 한 번에 맞히면 횟수가 줄어요.</p>`:'<p class="muted">아직 없어요.</p>'}
    </div>
    <div class="card">
      <h3>날짜별 기록</h3>
      ${hist.length?`<div class="table-wrap"><table><thead><tr><th>날짜</th><th>학습 단어</th><th>틀린 단어</th><th>XP</th></tr></thead><tbody>
        ${hist.map(h=>`<tr><td>${h.date}${h.plays>1?`<br><span class="muted small">${h.plays}번 플레이</span>`:''}</td><td>${h.words.map(w=>`<div><span class="en-font">${esc(w.en)}</span> <span class="muted">${esc(w.ko)}</span> ${badge(w.source,true)}</div>`).join('')}</td><td>${h.wrong.length?h.wrong.map(esc).join(', '):'-'}</td><td>+${h.stars}</td></tr>`).join('')}
      </tbody></table></div>`:'<p class="muted">아직 기록이 없어요. 첫 미션을 마치면 쌓여요.</p>'}
    </div>
    <div class="row between">
      <button class="btn ghost sm" onclick="goWords('admin')">단어 관리로</button>
      <button class="btn ghost sm" onclick="resetRecords()">기록 초기화</button>
    </div>`);
}
async function resetRecords(){
  const ok=await confirmBox('XP, 레벨, 학습 기록, 틀린 단어, 게임별 정답률, 발음 기록을 모두 지울까요?<br><span class="muted small">단어 주머니, 아이 이름, 비밀번호는 남아요. 지운 기록은 되돌릴 수 없어요.</span>','모두 지우기','취소');
  if(!ok)return;
  const t=todayObj();if(t&&!t.done)returnToQueues(t);
  Object.assign(S,{stars:0,history:[],wrong:{},wordBook:{},streak:0,lastStudy:null,today:null,bonus:{date:'',count:0},gameStats:{},speakHard:{},speakBest:{}});
  save();goRecords();toast('기록 초기화 완료');
}

goHome();
